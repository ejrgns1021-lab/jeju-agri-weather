# 라이브(실제 서비스) 배포 — 사용자가 PR을 승인(Merge)해 main에 들어오면 자동 실행
# 필요하면 Actions 화면에서 직접 다시 실행도 가능 (DEPLOY 입력)
name: 라이브 배포 (main)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "라이브에 다시 배포하려면 DEPLOY 를 입력하세요"
        required: true

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == 'DEPLOY')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 백엔드 테스트 (실패하면 배포 중단)
        working-directory: functions
        run: |
          pip install -q -r requirements.txt
          python tests/test_backend.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools@14

      - name: 배포용 인증 정보
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "::error::깃허브 Secret FIREBASE_SERVICE_ACCOUNT 가 없습니다 (README 의 자동 배포 설정 참고)"; exit 1; fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 라이브 배포
        run: |
          cd functions && python -m venv venv && ./venv/bin/pip install -q -r requirements.txt && cd ..
          firebase deploy --project jeju-agri-weather --force --non-interactive

      - name: 라이브 주소
        run: |
          echo "### 라이브 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "https://jeju-agri-weather.web.app" >> "$GITHUB_STEP_SUMMARY"
